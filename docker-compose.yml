# Local development services.
#   docker compose up -d db                      PostgreSQL only
#   docker compose --profile reports up -d       PostgreSQL + Metabase (http://localhost:3000,
#                                                or METABASE_PORT from .env)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
      POSTGRES_DB: auditor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, LOCAL DEVELOPMENT ONLY. Idempotent; runs on every `--profile reports up`.
  #   metabase         owns Metabase's own app database (users, questions, dashboards)
  #   metabase_reader  the login Metabase READS our data with; member of auditor_read, which
  #                    can SELECT the `reporting` views only (never the `inventory` tables)
  # The SQL is inline (no bind mount): host file sharing on Windows can hang container
  # creation. In AWS (Phase 4) these roles get generated passwords instead.
  db-setup:
    image: postgres:17
    profiles: ["reports"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: auditor
      # Fail fast instead of hanging: unreachable server, or a lock held by another session
      # (e.g. a DB tool left "idle in transaction"), becomes an error within seconds.
      PGCONNECT_TIMEOUT: "10"
      PGOPTIONS: "-c lock_timeout=15s -c statement_timeout=60s"
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h db -U auditor -d auditor -v ON_ERROR_STOP=1 -q <<'SQL'
        SELECT 'CREATE ROLE metabase LOGIN PASSWORD ''metabase'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'metabase')\gexec
        SELECT 'CREATE DATABASE metabase OWNER metabase'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'metabase')\gexec
        SELECT 'CREATE ROLE auditor_read NOLOGIN'
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'auditor_read')\gexec
        SELECT 'CREATE ROLE metabase_reader LOGIN PASSWORD ''metabase_reader'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'metabase_reader')\gexec
        GRANT auditor_read TO metabase_reader;
        SQL
    restart: "no"

  metabase:
    # Pinned by tag AND digest (exact image). Version chosen from GitHub releases, >= 2 weeks old.
    image: metabase/metabase:v0.65.2.2@sha256:ba7747434573539ca306c2b83dfcf23dcabc346769becf004cdd618a52e1e96c
    profiles: ["reports"]
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - "${METABASE_PORT:-3000}:3000" # set METABASE_PORT in .env if 3000 is taken
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      # No calls home: version checks and anonymous usage tracking off.
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
