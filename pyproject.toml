[project]
name = "github-auditor"
version = "0.1.0"
description = "Inventory and audit GitHub repositories, branches, protection, access, and workflows"
readme = "README.md"
requires-python = ">=3.14"
# Versions are NOT hand-pinned here. Run `pip-compile` to resolve the latest
# versions into requirements*.txt (hashed), then `pip-audit` them. See README.
dependencies = [
    "httpx",
    "pyjwt[crypto]",
    "pydantic",
    "pydantic-settings",
    # SQLAlchemy/Alembic are not allowed (Sonatype policy, CWE-502). Use psycopg directly;
    # migrations are plain SQL run by auditor.db.migrate.
    "psycopg[binary]",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
    "ruff",
    "mypy",
    "pip-tools",
    "pip-audit",
    "pre-commit",
]

[project.scripts]
auditor = "auditor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
