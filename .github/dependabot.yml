version: 2
updates:
  - package-ecosystem: pip # updates the pip-compile lock files
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose # Metabase image (tag + digest) in docker-compose.yml
    directory: "/"
    schedule:
      interval: weekly
  # docker ecosystem added in Phase 4 when the collector Dockerfile exists
